name: Generate Neural Contribution Graph

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Synthesize Neural Network
        uses: your-username/neural-contribution-net@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          svg_out_path: dist/neural-net.svg
          theme: cyberpunk
          animation_speed: normal
          max_links_per_neuron: 3
          curved_lines: true
          generate_theme_variants: true

      - name: Commit and Push SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/neural-net*.svg
          git diff --staged --quiet || (git commit -m "chore(neural-net): update contribution synapses [skip ci]" && git push)
